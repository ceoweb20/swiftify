name: qt-probe
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-2022
    steps:
      - shell: bash
        run: |
          python -m pip install aqtinstall==3.3.0
          python -m aqt list-qt windows desktop | tail -3
          for v in 6.9.3 6.10.3 6.11.3 6.12.0; do
            echo "== $v"
            python -m aqt list-qt windows desktop --arch $v 2>&1 | tail -4
          done
