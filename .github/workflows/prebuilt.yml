# Native macOS arm64/Intel, Windows x64 and Linux x64 builds, plus signed update
# metadata for the in-app updater. Pushing a v<version> tag publishes a release.
name: prebuilt

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/prebuilt.yml
      - tools/build-windows.ps1
      - tools/build-linux-tarball.sh
      - tools/build-macos-portable.sh
      - tools/package-portable.py
      - tools/sign-updates.py
      - tools/update-helper/**
      - CMakeLists.txt
      - cmake/**
      - src/**
      - qml/**
      - spotify-core/**
      - translations/**

permissions:
  contents: read

env:
  QT_VERSION: 6.11.3
  SWIFTIFY_UPDATE_PUBLIC_KEY: ${{ vars.SWIFTIFY_UPDATE_PUBLIC_KEY }}
  # builds update from the repository that built them
  SWIFTIFY_UPDATE_REPOSITORY: ${{ github.repository }}
  CARGO_BUILD_JOBS: 4

concurrency:
  group: prebuilt-${{ github.workflow }}-${{ github.ref }}
  # a run on main may be the one that publishes a release: never cancel it for a newer push
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    # windows-2025 and windows-latest come with visual studio 2026, which
    # build-windows.ps1 does not take
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: version
        id: version
        shell: bash
        run: |
          version="$(sed -n '/^project(Swiftify/,/VERSION/s/^ *VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "the tag $GITHUB_REF_NAME does not match the version $version in CMakeLists.txt" >&2
            exit 1
          fi
          echo "name=swiftify-$version-windows-x86_64" >> "$GITHUB_OUTPUT"

      # as ctest runs it. the test runs a failing command on purpose, which a
      # plain pwsh step would report as its own exit code
      - name: test the build script
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./tests/check_windows_build.ps1

      - uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          # Qt 6.11 and newer have no msvc2022 kit on the Windows mirror
          # (aqt cannot list it), and the QML needs 6.10 or newer
          version: 6.10.3
          arch: win64_msvc2022_64
          modules: qtshadertools
          cache: true

      - name: build
        shell: pwsh
        run: >
          .\tools\build-windows.ps1 -QtPath $env:QT_ROOT_DIR
          -BuildRoot "$env:RUNNER_TEMP\build"
          -InstallPrefix "$env:RUNNER_TEMP\${{ steps.version.outputs.name }}"

      # msvc's headers have the media controls, so a build without them is a bug
      - name: check the media controls are in
        shell: pwsh
        run: |
          $cache = Get-ChildItem "$env:RUNNER_TEMP\build\*\swiftify\CMakeCache.txt"
          if (-not (Select-String -Path $cache -Pattern '^SWIFTIFY_HAVE_SMTC:INTERNAL=1$' -Quiet)) {
            throw 'built without the windows media controls'
          }

      # every dll the exe and its libraries load has to be in the zip, or be
      # part of windows. the c++ runtime counts as missing unless it is bundled
      - name: check every library is there
        shell: pwsh
        run: |
          $root = "$env:RUNNER_TEMP\${{ steps.version.outputs.name }}"
          $bin = Join-Path $root 'bin'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $dumpbin = & $vswhere -latest -find 'VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe' | Select-Object -First 1
          if (-not $dumpbin) { throw 'dumpbin not found' }
          $missing = @()
          foreach ($file in Get-ChildItem $root -Recurse -Include *.exe, *.dll) {
            $dependents = & $dumpbin /nologo /dependents $file.FullName |
              Where-Object { $_ -match '^\s+\S+\.dll\s*$' } | ForEach-Object { $_.Trim() }
            foreach ($dll in $dependents) {
              if ($dll -match '^(api|ext)-ms-') { continue }
              if ((Test-Path (Join-Path $bin $dll)) -or (Test-Path (Join-Path $file.DirectoryName $dll))) { continue }
              $system = Test-Path (Join-Path "$env:SystemRoot\System32" $dll)
              if ($system -and $dll -notmatch '^(vcruntime|msvcp|concrt|vccorlib)') { continue }
              $missing += "$($file.FullName.Substring($root.Length + 1)) needs $dll"
            }
          }
          if ($missing) {
            $missing | Sort-Object -Unique | Write-Host
            throw 'libraries missing from the zip'
          }

      - name: test the encrypted credential store on Windows
        shell: pwsh
        run: |
          . ./tools/build-windows.ps1
          Initialize-Msvc | Out-Host
          $cache = Get-ChildItem "$env:RUNNER_TEMP\build\*\swiftify\CMakeCache.txt" | Select-Object -First 1
          if (-not $cache) { throw 'Application build directory not found' }
          $build = $cache.DirectoryName
          $deps = Join-Path (Split-Path -Parent $build) 'deps\bin'
          $env:PATH = "$deps;$env:QT_ROOT_DIR\bin;$env:PATH"
          cmake -S . -B $build -DBUILD_TESTING=ON
          if ($LASTEXITCODE -ne 0) { throw 'Vault test configuration failed' }
          cmake --build $build --parallel 4 --target tst_vault
          if ($LASTEXITCODE -ne 0) { throw 'Vault test build failed' }
          ctest --test-dir $build --output-on-failure -R '^tst_vault$'
          if ($LASTEXITCODE -ne 0) { throw 'Vault tests failed' }

      - name: package
        shell: pwsh
        run: python tools/package-portable.py --root "$env:RUNNER_TEMP\${{ steps.version.outputs.name }}" --target windows-x86_64 --out dist

      - name: updater tests
        shell: bash
        run: |
          cargo test --locked --manifest-path tools/update-helper/Cargo.toml
          cargo test --locked --manifest-path spotify-core/Cargo.toml --no-default-features --features capi vault::tests
          python tests/check_update_tools.py

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: dist/*.zip
          if-no-files-found: error

  linux:
    # the oldest supported runner, so the tarball runs on older distros too
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: version
        run: |
          version="$(sed -n '/^project(Swiftify/,/VERSION/s/^ *VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "the tag $GITHUB_REF_NAME does not match the version $version in CMakeLists.txt" >&2
            exit 1
          fi

      # build and bundling dependencies. the xcb, wayland and vulkan libraries
      # are what qt's plugins link, linuxdeploy has to find them to bundle them
      - name: packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++-12 ninja-build pkg-config \
            libpulse-dev libasound2-dev libssl-dev \
            libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-0 \
            libfontconfig1-dev libfreetype-dev libdbus-1-dev \
            libwayland-dev libwayland-egl1 libvulkan1 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libxcb-xinput0

      - uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: ${{ env.QT_VERSION }}
          arch: linux_gcc_64
          # soloist, which is only built for linux, talks to spotify's soloist over websockets
          modules: qtshadertools qtwebsockets
          cache: true

      - name: build
        env:
          CC: gcc-12
          CXX: g++-12
        run: ./tools/build-linux-tarball.sh --qt "$QT_ROOT_DIR" --out dist

      - name: updater tests
        run: |
          cargo test --locked --manifest-path tools/update-helper/Cargo.toml
          cargo test --locked --manifest-path spotify-core/Cargo.toml --no-default-features --features capi vault::tests
          python3 tests/check_update_tools.py

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux
          path: dist/*.zip
          if-no-files-found: error

  macos:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: version
        run: |
          version="$(sed -n '/^project(Swiftify/,/VERSION/s/^ *VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "tag does not match CMakeLists.txt" >&2
            exit 1
          fi
      - uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: ${{ env.QT_VERSION }}
          arch: clang_64
          modules: qtshadertools
          cache: true
      # Keep the release identity consistent. Runtime credentials use the
      # encrypted vault, not a keychain, regardless of this signing certificate.
      # without the secret the app is signed ad hoc, as a pull request's is
      - name: import the signing identity
        env:
          MACOS_SIGNING_P12: ${{ secrets.MACOS_SIGNING_P12 }}
          MACOS_SIGNING_PASSWORD: ${{ secrets.MACOS_SIGNING_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
        run: |
          if [[ -z "$MACOS_SIGNING_P12" || -z "$MACOS_SIGNING_IDENTITY" ]]; then
            echo 'No signing identity: the app is signed ad hoc.'
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(uuidgen)"
          echo "$MACOS_SIGNING_P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -P "$MACOS_SIGNING_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          # the runner is thrown away afterwards, so its keychain list may be rewritten
          existing="$(security list-keychains -d user | tr -d '"' | xargs)"
          security list-keychains -d user -s "$keychain" $existing
          rm -f "$RUNNER_TEMP/signing.p12"
          echo "SWIFTIFY_CODESIGN_IDENTITY=$MACOS_SIGNING_IDENTITY" >> "$GITHUB_ENV"

      - name: build and package
        env:
          SWIFTIFY_BUILD_ROOT: ${{ runner.temp }}/swiftify-build
          MACOSX_DEPLOYMENT_TARGET: '13.0'
        run: bash tools/build-macos-portable.sh
      - name: updater tests
        run: |
          cargo test --locked --manifest-path tools/update-helper/Cargo.toml
          cargo test --locked --manifest-path spotify-core/Cargo.toml --no-default-features --features capi vault::tests
          python3 tests/check_update_tools.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.runner }}
          path: dist/*.zip
          if-no-files-found: error

  # a release is made for every version in CMakeLists.txt that has none yet, once
  # all four builds pass on main (or when its v<version> tag is pushed)
  release:
    if: github.ref_type == 'tag' || (github.ref == 'refs/heads/main' && github.event_name == 'push')
    needs: [windows, linux, macos]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: decide the release
        id: release
        run: |
          version="$(sed -n '/^project(Swiftify/,/VERSION/s/^ *VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)"
          tag="v$version"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo "the tag $GITHUB_REF_NAME does not match the version $version in CMakeLists.txt" >&2
            exit 1
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$tag is already released; raise the version in CMakeLists.txt for a new release."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.release.outputs.publish == 'true'
        with:
          path: dist
          merge-multiple: true

      # Dependency installation must not inherit the private signing seed.
      - name: prepare signing tool
        if: steps.release.outputs.publish == 'true' && vars.SWIFTIFY_UPDATE_PUBLIC_KEY != ''
        run: |
          python3 -m venv "$RUNNER_TEMP/update-signing"
          "$RUNNER_TEMP/update-signing/bin/python" -m pip install 'cryptography==49.0.0'

      - name: sign update manifests
        if: steps.release.outputs.publish == 'true'
        env:
          SWIFTIFY_UPDATE_SIGNING_KEY: ${{ secrets.SWIFTIFY_UPDATE_SIGNING_KEY }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          if [[ -n "$SWIFTIFY_UPDATE_PUBLIC_KEY" || -n "$SWIFTIFY_UPDATE_SIGNING_KEY" ]]; then
            test -n "$SWIFTIFY_UPDATE_PUBLIC_KEY" && test -n "$SWIFTIFY_UPDATE_SIGNING_KEY"
            "$RUNNER_TEMP/update-signing/bin/python" tools/sign-updates.py dist
          else
            echo 'No update key configured: publishing archives without OTA manifests.'
          fi

      # published at once: the in-app updater only sees published, non-draft releases
      - name: publish
        if: steps.release.outputs.publish == 'true'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: >
          gh release create "$RELEASE_TAG" dist/*
          --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA"
          --title "Swiftify ${RELEASE_TAG#v}" --generate-notes --latest
