[package]
name = "spotify-core"
version = "0.1.8"
edition = "2024"

[dependencies]
env_logger = "0.11"
# the dealer's message streams (reporter.rs)
futures-util = "0.3"
hound = "3.5.1"
# a playlist read through the session (playlist.rs), as librespot reads it
http = "=1.5.0"
librespot = "=0.8.0"
rustfft = "=6.4.1"
# the audio output the live (soloist) route plays through
rodio = { version = "=0.21.1", default-features = false, features = ["playback"] }
protobuf = "=3.7.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
swift-bridge = { version = "=0.1.59", features = ["async"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }

[build-dependencies]
swift-bridge-build = { version = "=0.1.59", optional = true }

[features]
default = ["swift"]
# the swift-bridge interface the macos and ios apps link against.
swift = ["dep:swift-bridge", "dep:swift-bridge-build"]
# a plain c abi for the linux qt front end (include/swiftify_core.h).
capi = []

[lib]
crate-type = ["staticlib"]

[profile.release]
codegen-units = 1
lto = "thin"
strip = "debuginfo"

[patch.crates-io]
librespot-core = { path = "vendor/librespot-core" }
